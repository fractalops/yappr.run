version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    # wasm-bindgen must match the wasm-bindgen-cli version in the workflows
    # and scripts/build.sh.
    ignore:
      - dependency-name: wasm-bindgen

  # The app uses pnpm. Dependabot reads app/pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Major updates come one per pull request, because they can need changes
    # to the app.
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # SvelteKit and svelte-check use the JavaScript API of TypeScript, which
    # TypeScript 7 does not have.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
